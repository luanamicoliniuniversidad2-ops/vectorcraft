[package]
name = "vectorcraft-android"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
vectorcraft-engine = { workspace = true }
vectorcraft-ui-egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "android-native-activity"] }
egui = { workspace = true }
log = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }

# Settings read by cargo-apk when it packages the APK.
[package.metadata.android]
package = "org.personal.vectorcraft"
apk_name = "VectorCraft"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.android.application]
label = "VectorCraft"
